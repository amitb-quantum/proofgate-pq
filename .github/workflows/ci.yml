name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src/proofgate
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - run: python -m proofgate attacks
      - run: python -m proofgate --root .demo-ci quantum-demo --quorum 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: reports/
